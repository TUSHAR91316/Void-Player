[versions]
kotlin = "2.3.21"
compose-plugin = "1.11.1"
android-gradle-plugin = "8.13.2"
androidx-activity = "1.9.3"
androidx-core = "1.15.0"
media3 = "1.11.1"
jaudiotagger = "3.0.1"
palette = "1.0.0"
documentfile = "1.0.1"

[libraries]
documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-palette = { module = "androidx.palette:palette", version.ref = "palette" }
# Plugin deps
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "android-gradle-plugin" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-plugin" }

# Android
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
jaudiotagger = { module = "net.jthink:jaudiotagger", version.ref = "jaudiotagger" }


[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
