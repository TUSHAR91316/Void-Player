name: Windows desktop

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build WinUI app
        run: dotnet build desktop-winui/VoidPlayer.WinUI.csproj -c Release -p:Platform=x64
      - name: Run desktop unit tests
        run: dotnet test desktop-winui.Tests/VoidPlayer.WinUI.Tests.csproj -c Release -p:Platform=x64
